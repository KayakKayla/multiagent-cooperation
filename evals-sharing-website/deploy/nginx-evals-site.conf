# Standalone loopback-only cap proxy. Never include the distribution nginx.conf
# or sites-enabled: Apache retains public ports 80/443 and existing sites.
user www-data;
worker_processes 1;
pid /run/evals-site-nginx.pid;
# Nginx request-error messages can include OAuth query strings.
error_log /dev/null crit;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 20971520;
    client_body_timeout 30s;
    client_header_timeout 15s;

    server {
        listen 127.0.0.1:8001;
        server_name rowan.gaertner.ca;

        error_page 413 = @body_too_large;
        location @body_too_large {
            default_type text/plain;
            add_header X-Evals-Body-Limit 20971520 always;
            return 413 "Request body exceeds 20 MiB.\n";
        }

        location / {
            # No URI suffix: preserve the path Apache has already stripped.
            proxy_pass http://127.0.0.1:8000;
            # Both settings are needed to stream incoming HTTP/1.1 chunked bodies.
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            # Only loopback Apache is expected here; it sanitized XFF already.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_redirect off;
        }
    }
}
